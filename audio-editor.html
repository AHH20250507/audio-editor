<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0d0d1a">
  <title>音频编辑器 - 上传 · 调节音量 · 裁剪 · 导出MP3</title>
  <style>
/* ===== CSS Variables ===== */
:root {
  --bg-primary: #0d0d1a;
  --bg-secondary: #16162a;
  --bg-card: #1c1c38;
  --bg-card-hover: #24244a;
  --bg-input: #14142a;
  --accent: #7c5cff;
  --accent-light: #9d7fff;
  --accent-dark: #6b4dee;
  --accent-gradient: linear-gradient(135deg, #7c5cff, #5c8dff);
  --accent-glow: rgba(124, 92, 255, 0.3);
  --text-primary: #ffffff;
  --text-secondary: #a0a0c0;
  --text-muted: #606080;
  --border: #2a2a4a;
  --border-light: #3a3a5a;
  --danger: #ff4757;
  --success: #2ed573;
  --warning: #ffa502;
  --radius: 14px;
  --radius-sm: 10px;
  --radius-xs: 6px;
  --shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
  --shadow-glow: 0 0 20px rgba(124, 92, 255, 0.15);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

/* ===== Reset ===== */
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  min-height: 100dvh;
  line-height: 1.5;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

input, button {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  border: none;
  background: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.hidden {
  display: none !important;
}

/* ===== App Container ===== */
.app {
  max-width: 680px;
  margin: 0 auto;
  padding: 20px 16px 40px;
  padding-top: max(20px, env(safe-area-inset-top));
  padding-bottom: max(40px, env(safe-area-inset-bottom));
}

/* ===== Header ===== */
.app-header {
  text-align: center;
  margin-bottom: 28px;
}

.app-header h1 {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.5px;
  background: var(--accent-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.app-header .subtitle {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 6px;
  letter-spacing: 0.5px;
}

/* ===== Upload Zone ===== */
.upload-zone {
  border: 2px dashed var(--border-light);
  border-radius: var(--radius);
  padding: 48px 24px;
  text-align: center;
  cursor: pointer;
  transition: var(--transition);
  background: var(--bg-secondary);
  position: relative;
  overflow: hidden;
}

.upload-zone::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at center, var(--accent-glow), transparent 70%);
  opacity: 0;
  transition: var(--transition);
  pointer-events: none;
}

.upload-zone:hover,
.upload-zone.dragover {
  border-color: var(--accent);
  background: var(--bg-card);
  transform: translateY(-2px);
}

.upload-zone:hover::before,
.upload-zone.dragover::before {
  opacity: 1;
}

.upload-icon {
  color: var(--accent);
  margin-bottom: 16px;
  display: flex;
  justify-content: center;
  position: relative;
}

.upload-text {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-primary);
  position: relative;
}

.upload-hint {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 8px;
  position: relative;
}

.upload-tip {
  font-size: 12px;
  color: var(--warning);
  margin-top: 12px;
  padding: 8px 14px;
  background: rgba(255, 165, 2, 0.1);
  border-radius: 8px;
  position: relative;
  display: inline-block;
}

/* ===== Loading ===== */
.loading-zone {
  text-align: center;
  padding: 48px 24px;
  color: var(--text-secondary);
}

.spinner {
  width: 40px;
  height: 40px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  margin: 0 auto 16px;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ===== Editor ===== */
.editor {
  display: flex;
  flex-direction: column;
  gap: 14px;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== File Bar ===== */
.file-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 14px;
  background: var(--bg-card);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
}

.file-info {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  flex: 1;
}

.file-icon {
  color: var(--accent);
  flex-shrink: 0;
}

.file-name {
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ===== Card ===== */
.card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 16px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
}

.card-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* ===== Waveform ===== */
.waveform-card {
  padding: 16px 12px;
}

#waveform {
  width: 100%;
  border-radius: var(--radius-xs);
  overflow: hidden;
}

#waveform canvas {
  max-width: 100%;
}

#wave-timeline {
  margin-top: 4px;
}

.waveform-hint {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 10px;
  text-align: center;
}

/* ===== Time Controls ===== */
.time-controls {
  display: flex;
  gap: 10px;
}

.time-field {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.time-field label {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.time-field input {
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
  padding: 10px 8px;
  font-size: 14px;
  font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
  text-align: center;
  color: var(--text-primary);
  transition: var(--transition);
  width: 100%;
  min-width: 0;
}

.time-field input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

.time-display {
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
  padding: 10px 8px;
  font-size: 14px;
  font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
  text-align: center;
  color: var(--accent-light);
  font-weight: 600;
}

/* ===== Volume Control ===== */
.volume-badge {
  background: var(--accent);
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  padding: 2px 10px;
  border-radius: 20px;
  min-width: 52px;
  text-align: center;
}

.volume-control {
  display: flex;
  align-items: center;
  gap: 12px;
}

.volume-tick {
  font-size: 11px;
  color: var(--text-muted);
  flex-shrink: 0;
  font-weight: 600;
}

.slider-wrap {
  flex: 1;
  position: relative;
  padding: 8px 0;
}

/* ===== Range Slider ===== */
input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 6px;
  border-radius: 3px;
  background: linear-gradient(to right,
    var(--accent) 0%,
    var(--accent) var(--fill, 20%),
    var(--border) var(--fill, 20%),
    var(--border) 100%);
  outline: none;
  cursor: pointer;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #fff;
  border: 3px solid var(--accent);
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
  transition: var(--transition);
}

input[type="range"]::-webkit-slider-thumb:hover,
input[type="range"]::-webkit-slider-thumb:active {
  transform: scale(1.15);
  box-shadow: 0 2px 12px var(--accent-glow);
}

input[type="range"]::-moz-range-thumb {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #fff;
  border: 3px solid var(--accent);
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
}

input[type="range"]::-moz-range-track {
  height: 6px;
  border-radius: 3px;
  background: var(--border);
}

input[type="range"]::-moz-range-progress {
  height: 6px;
  border-radius: 3px;
  background: var(--accent);
}

.volume-marks {
  display: flex;
  justify-content: space-between;
  margin-top: 6px;
  position: relative;
}

.volume-marks .mark {
  width: 2px;
  height: 4px;
  background: var(--border-light);
  border-radius: 1px;
}

/* ===== Buttons ===== */
.actions-card {
  display: flex;
  gap: 10px;
  padding: 14px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px 20px;
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-weight: 600;
  transition: var(--transition);
  user-select: none;
  -webkit-user-select: none;
  white-space: nowrap;
}

.btn:active {
  transform: scale(0.97);
}

.btn-icon {
  flex-shrink: 0;
}

.btn-primary {
  flex: 1;
  background: var(--accent-gradient);
  color: #fff;
  box-shadow: 0 4px 14px var(--accent-glow);
}

.btn-primary:hover {
  box-shadow: 0 6px 20px var(--accent-glow);
  filter: brightness(1.1);
}

.btn-primary.playing {
  background: linear-gradient(135deg, #ff4757, #ff6b6b);
  box-shadow: 0 4px 14px rgba(255, 71, 87, 0.3);
}

.btn-export {
  flex: 1;
  background: var(--bg-input);
  color: var(--text-primary);
  border: 1px solid var(--border-light);
}

.btn-export:hover:not(:disabled) {
  border-color: var(--accent);
  color: var(--accent-light);
}

.btn-export:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.btn-text {
  padding: 6px 12px;
  font-size: 13px;
  color: var(--accent-light);
  font-weight: 600;
  flex-shrink: 0;
}

.btn-text:hover {
  color: var(--accent);
}

/* ===== Export Progress ===== */
.export-progress {
  padding: 16px;
  background: var(--bg-card);
  border-radius: var(--radius);
  border: 1px solid var(--border);
}

.progress-bar {
  height: 8px;
  background: var(--bg-input);
  border-radius: 4px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: var(--accent-gradient);
  border-radius: 4px;
  transition: width 0.3s ease;
}

.progress-text {
  font-size: 13px;
  color: var(--text-secondary);
  margin-top: 10px;
  text-align: center;
}

/* ===== Toast ===== */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg-card);
  border: 1px solid var(--border-light);
  color: var(--text-primary);
  padding: 12px 24px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 500;
  box-shadow: var(--shadow);
  z-index: 9999;
  animation: toastIn 0.3s ease;
  max-width: 90%;
  text-align: center;
}

.toast.success {
  border-color: var(--success);
  color: var(--success);
}

.toast.error {
  border-color: var(--danger);
  color: var(--danger);
}

@keyframes toastIn {
  from { opacity: 0; transform: translateX(-50%) translateY(20px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

/* ===== WaveSurfer Overrides ===== */
#waveform > div {
  background: transparent !important;
}

/* Region styling */
[data-part="region-handle"] {
  width: 8px !important;
}

/* ===== Mobile Responsive ===== */
@media (max-width: 480px) {
  .app {
    padding: 16px 12px 32px;
  }

  .app-header h1 {
    font-size: 24px;
  }

  .app-header .subtitle {
    font-size: 12px;
  }

  .upload-zone {
    padding: 36px 20px;
  }

  .upload-text {
    font-size: 15px;
  }

  .card {
    padding: 14px 12px;
  }

  .time-controls {
    flex-direction: row;
    gap: 8px;
  }

  .time-field input {
    font-size: 13px;
    padding: 9px 6px;
  }

  .actions-card {
    flex-direction: column;
  }

  .btn {
    width: 100%;
    padding: 14px;
    font-size: 15px;
  }

  input[type="range"]::-webkit-slider-thumb {
    width: 26px;
    height: 26px;
  }

  input[type="range"]::-moz-range-thumb {
    width: 26px;
    height: 26px;
  }
}

/* ===== Extra small screens ===== */
@media (max-width: 360px) {
  .time-controls {
    flex-wrap: wrap;
  }

  .time-field {
    min-width: calc(50% - 4px);
  }
}

/* ===== Landscape on mobile ===== */
@media (max-height: 500px) and (orientation: landscape) {
  .app-header {
    margin-bottom: 16px;
  }

  .app-header h1 {
    font-size: 20px;
  }

  .upload-zone {
    padding: 24px 20px;
  }
}

</style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>音频编辑器</h1>
      <p class="subtitle">上传 · 调节音量 · 裁剪 · 导出 MP3</p>
    </header>

    <!-- Upload Zone -->
    <div id="uploadZone" class="upload-zone">
      <input type="file" id="fileInput" accept=".mp3,.wav,.ogg,.m4a,.flac,.aac,.wma,.opus,audio/mpeg,audio/wav,audio/ogg,audio/mp4,audio/aac,audio/x-flac,audio/flac" hidden>
      <div class="upload-icon">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      </div>
      <p class="upload-text">点击选择音频文件</p>
      <p class="upload-hint">支持 MP3 / WAV / OGG / M4A / FLAC 等格式</p>
      <p class="upload-tip">手机用户：请通过「文件管理」选择音频，不要选「录音」App</p>
    </div>

    <!-- Loading -->
    <div id="loadingZone" class="loading-zone hidden">
      <div class="spinner"></div>
      <p>正在加载音频...</p>
    </div>

    <!-- Editor -->
    <div id="editor" class="editor hidden">
      <!-- File Info Bar -->
      <div class="file-bar">
        <div class="file-info">
          <svg class="file-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"/>
            <circle cx="6" cy="18" r="3"/>
            <circle cx="18" cy="16" r="3"/>
          </svg>
          <span class="file-name" id="fileName"></span>
        </div>
        <button class="btn btn-text" id="reuploadBtn">重新上传</button>
      </div>

      <!-- Waveform -->
      <div class="card waveform-card">
        <div class="card-label">波形预览</div>
        <div id="waveform"></div>
        <div id="wave-timeline"></div>
        <p class="waveform-hint">拖动两侧手柄选择片段，或拖动整个区域移动</p>
      </div>

      <!-- Time Controls -->
      <div class="card">
        <div class="card-label">时间选择</div>
        <div class="time-controls">
          <div class="time-field">
            <label>开始</label>
            <input type="text" id="startTime" value="00:00.000" placeholder="mm:ss.xxx" inputmode="decimal">
          </div>
          <div class="time-field">
            <label>结束</label>
            <input type="text" id="endTime" value="00:00.000" placeholder="mm:ss.xxx" inputmode="decimal">
          </div>
          <div class="time-field">
            <label>选中时长</label>
            <div class="time-display" id="durationDisplay">00:00.000</div>
          </div>
        </div>
      </div>

      <!-- Volume Control -->
      <div class="card">
        <div class="card-label">
          音量调节
          <span class="volume-badge" id="volumeValue">100%</span>
        </div>
        <div class="volume-control">
          <span class="volume-tick">0%</span>
          <div class="slider-wrap">
            <input type="range" id="volumeSlider" min="0" max="500" value="100" step="1">
            <div class="volume-marks">
              <span class="mark" style="left: 0%"></span>
              <span class="mark" style="left: 20%"></span>
              <span class="mark" style="left: 40%"></span>
              <span class="mark" style="left: 60%"></span>
              <span class="mark" style="left: 80%"></span>
              <span class="mark" style="left: 100%"></span>
            </div>
          </div>
          <span class="volume-tick">500%</span>
        </div>
      </div>

      <!-- Playback & Export -->
      <div class="card actions-card">
        <button class="btn btn-primary" id="previewBtn">
          <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <span>试听片段</span>
        </button>
        <button class="btn btn-export" id="exportBtn">
          <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <span>导出 MP3</span>
        </button>
      </div>

      <!-- Export Progress -->
      <div id="exportProgress" class="export-progress hidden">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <p id="progressText" class="progress-text">导出中...</p>
      </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <script>

      const vol = parseInt(volumeSlider.value) / 100;
      const sampleRate = audioBuffer.sampleRate;
      const channels = Math.min(audioBuffer.numberOfChannels, 2);
      const length = Math.floor((end - start) * sampleRate);
      const offlineCtx = new OfflineAudioContext(channels, length, sampleRate);
      const src = offlineCtx.createBufferSource();
      src.buffer = audioBuffer;
      const gain = offlineCtx.createGain();
      gain.gain.value = vol;
      src.connect(gain);
      gain.connect(offlineCtx.destination);
      src.start(0, start, end - start);
      progressFill.style.width = "30%";
      progressText.textContent = "\u6B63\u5728\u6E32\u67D3\u97F3\u9891...";
      const rendered = await offlineCtx.startRendering();
      progressFill.style.width = "60%";
      progressText.textContent = "\u6B63\u5728\u7F16\u7801 MP3...";
      await new Promise((r3) => setTimeout(r3, 50));
      const mp3Blob = encodeMP3(rendered);
      progressFill.style.width = "100%";
      progressText.textContent = "\u5BFC\u51FA\u5B8C\u6210\uFF01";
      const url = URL.createObjectURL(mp3Blob);
      const a3 = document.createElement("a");
      a3.href = url;
      const baseName = fileNameEl.textContent.replace(/\.[^.]+$/, "");
      a3.download = `${baseName}_edited.mp3`;
      document.body.appendChild(a3);
      a3.click();
      document.body.removeChild(a3);
      setTimeout(() => URL.revokeObjectURL(url), 1e3);
      showToast(`\u5DF2\u5BFC\u51FA ${formatTime(end - start)} \u7684 MP3 \u6587\u4EF6`, "success");
      setTimeout(() => {
        exportProgress.classList.add("hidden");
      }, 1500);
    } catch (err) {
      console.error("Export error:", err);
      progressText.textContent = "\u5BFC\u51FA\u5931\u8D25: " + err.message;
      showToast("\u5BFC\u51FA\u5931\u8D25\uFF0C\u8BF7\u91CD\u8BD5", "error");
    } finally {
      exportBtn.disabled = false;
    }
  }
  function encodeMP3(buffer) {
    const numChannels = Math.min(buffer.numberOfChannels, 2);
    const sampleRate = buffer.sampleRate;
    const kbps = 192;
    const encoder = new lamejs.Mp3Encoder(numChannels, sampleRate, kbps);
    const left = floatToInt16(buffer.getChannelData(0));
    const right = numChannels > 1 ? floatToInt16(buffer.getChannelData(1)) : null;
    const blockSize = 1152;
    const mp3Data = [];
    const totalBlocks = Math.ceil(left.length / blockSize);
    for (let i4 = 0; i4 < left.length; i4 += blockSize) {
      const leftChunk = left.subarray(i4, i4 + blockSize);
      let mp3buf;
      if (numChannels > 1 && right) {
        const rightChunk = right.subarray(i4, i4 + blockSize);
        mp3buf = encoder.encodeBuffer(leftChunk, rightChunk);
      } else {
        mp3buf = encoder.encodeBuffer(leftChunk);
      }
      if (mp3buf.length > 0) {
        mp3Data.push(mp3buf);
      }
    }
    const end = encoder.flush();
    if (end.length > 0) {
      mp3Data.push(end);
    }
    return new Blob(mp3Data, { type: "audio/mp3" });
  }
  function floatToInt16(float32) {
    const int16 = new Int16Array(float32.length);
    for (let i4 = 0; i4 < float32.length; i4++) {
      const s4 = Math.max(-1, Math.min(1, float32[i4]));
      int16[i4] = s4 < 0 ? s4 * 32768 : s4 * 32767;
    }
    return int16;
  }
  function formatTime(seconds) {
    if (isNaN(seconds) || seconds < 0) return "00:00.000";
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    const ms = Math.floor(seconds % 1 * 1e3);
    return `${pad(mins, 2)}:${pad(secs, 2)}.${pad(ms, 3)}`;
  }
  function parseTime(str) {
    if (!str) return NaN;
    str = str.trim();
    const match = str.match(/^(?:(\d+):)?(\d+)(?:\.(\d+))?$/);
    if (!match) return NaN;
    const mins = match[1] ? parseInt(match[1]) : 0;
    const secs = parseInt(match[2]);
    const msStr = match[3] || "0";
    const ms = parseInt(msStr.padEnd(3, "0").substring(0, 3));
    if (secs >= 60 && !match[1]) return NaN;
    return mins * 60 + secs + ms / 1e3;
  }
  function pad(n4, len) {
    return String(n4).padStart(len, "0");
  }
  var toastTimer = null;
  function showToast(msg, type = "") {
    clearTimeout(toastTimer);
    toast.textContent = msg;
    toast.className = "toast" + (type ? " " + type : "");
    toast.classList.remove("hidden");
    toastTimer = setTimeout(() => {
      toast.classList.add("hidden");
    }, 3e3);
  }
  function resetEditor() {
    stopPlayback();
    if (wavesurfer) {
      wavesurfer.destroy();
      wavesurfer = null;
    }
    audioBuffer = null;
    activeRegion = null;
    regionsPlugin = null;
    showEditor(false);
    uploadZone.classList.remove("hidden");
    fileInput.value = "";
    volumeSlider.value = 100;
    volumeValue.textContent = "100%";
    updateVolumeSliderFill();
    exportProgress.classList.add("hidden");
  }
  init();
  updateVolumeSliderFill();
})();

</script>
